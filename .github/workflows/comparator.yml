name: Comparator audit

# Runs the official leanprover/comparator on the SpherePackingsAudit/<Pair> pairs: for each pair
# it checks that Solution proves a statement whose full dependency closure matches Challenge's,
# uses only the permitted axioms, and is accepted by both the Lean kernel (replay) and the
# independent nanoda kernel (every comparator.json sets enable_nanoda).  The pinned toolchain
# does not bundle an exporter or external kernels, so the tools are built at the revisions below.
# One job builds the library and the audit modules once; one job per pair restores that build
# and runs the comparator.  See CI_ARTIFACTS.md.

on:
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'SpherePackingsAudit/**'
      - 'scripts/run_comparators.sh'
      - '.github/workflows/comparator.yml'
  workflow_dispatch:
    inputs:
      pairs:
        description: Comma-separated comparator pairs, or all.
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPARATOR_REV: "575674928e239f5bc452aab72d1dd7b0f1326494"   # leanprover/comparator
  LEAN4EXPORT_REV: "v4.34.0-rc2"                               # leanprover/lean4export; MUST match ./lean-toolchain
  NANODA_REV: "6ae1f0cd962f081f6c423454c5da729d841236a7"       # ammkrn/nanoda_lib
  LANDRUN_REV: "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"      # Zouuup/landrun (v0.1.18)

jobs:
  plan:
    name: Select comparator pairs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pairs.outputs.matrix }}
    steps:
      - id: pairs
        env:
          PAIRS: ${{ inputs.pairs }}
        run: |
          python3 - <<'PYPLAN'
          import json, os
          known = ['TheoremA', 'TheoremB', 'Prop11', 'Prop11TheoremsAB', 'Theorem61', 'Theorem41']
          wanted = (os.environ.get('PAIRS') or 'all').strip() or 'all'
          chosen = known if wanted == 'all' else [p.strip() for p in wanted.split(',')]
          if not chosen or any(p not in known for p in chosen) or len(set(chosen)) != len(chosen):
              raise SystemExit('Unknown or repeated comparator pair: ' + wanted)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'pair': chosen}) + '\n')
          PYPLAN

  build:
    name: Build the library and the audit modules
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enlarge swap
        shell: bash
        run: |
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/lean-swapfile"
          sudo fallocate -l 16G "$swapdir/lean-swapfile"
          sudo chmod 600 "$swapdir/lean-swapfile"
          sudo mkswap "$swapdir/lean-swapfile"
          sudo swapon "$swapdir/lean-swapfile"
          free -h

      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-delay 15 --retry-all-errors \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5; do
            if "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            echo "Toolchain download failed (attempt $attempt); retrying in $((30 * attempt)) s"
            sleep $((30 * attempt))
          done

      - name: Fetch the Mathlib cache
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if lake exe cache get; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((30 * attempt))
          done

      - name: Restore project build artifacts
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: .lake/build
          key: lake-cmp-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-cmp-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build the library and the audit surfaces
        shell: bash
        run: |
          set -o pipefail
          lake build SpherePackingsAudit 2>&1 | tee audit-build.log

      # Saved under the exact sha, which the pair jobs of this run restore.
      - name: Save project build artifacts
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .lake/build
          key: lake-cmp-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Retain the build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: comparator-build-${{ github.sha }}
          path: audit-build.log
          if-no-files-found: warn

  comparator:
    name: ${{ matrix.pair }}, Lean and nanoda kernels
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-delay 15 --retry-all-errors \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5; do
            if "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            echo "Toolchain download failed (attempt $attempt); retrying in $((30 * attempt)) s"
            sleep $((30 * attempt))
          done

      - name: Fetch the Mathlib cache
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if lake exe cache get; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((30 * attempt))
          done

      # Written by the build job of this same run; there is no fallback key.
      - name: Restore the project build of this run
        uses: actions/cache/restore@v6.1.0
        with:
          path: .lake/build
          key: lake-cmp-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Restore the verification tools
        id: tools-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      - name: Build comparator
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/comparator ~/tools/comparator
          git -C ~/tools/comparator checkout "$COMPARATOR_REV"
          cd ~/tools/comparator && lake build

      - name: Build lean4export (toolchain-matched)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/lean4export ~/tools/lean4export
          git -C ~/tools/lean4export checkout "$LEAN4EXPORT_REV"
          test "$(cat ~/tools/lean4export/lean-toolchain)" = "$(cat lean-toolchain)" \
            || { echo "lean4export toolchain does not match project toolchain"; exit 1; }
          cd ~/tools/lean4export && lake build

      - name: Set up Go (for landrun)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build landrun (static)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Zouuup/landrun ~/tools/landrun-src
          git -C ~/tools/landrun-src checkout "$LANDRUN_REV"
          mkdir -p ~/tools/bin
          cd ~/tools/landrun-src && CGO_ENABLED=0 go build -o ~/tools/bin/landrun ./cmd/landrun

      - name: Build nanoda
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          git clone https://github.com/ammkrn/nanoda_lib ~/tools/nanoda_lib
          git -C ~/tools/nanoda_lib checkout "$NANODA_REV"
          cd ~/tools/nanoda_lib && cargo +stable build --release

      # Saved only after a complete build of all four tools, so a partial tree is never banked.
      - name: Save the verification tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      - name: Run the comparator
        shell: bash
        env:
          COMPARATOR_BIN: /home/runner/tools/comparator/.lake/build/bin/comparator
          COMPARATOR_LANDRUN: /home/runner/tools/bin/landrun
          COMPARATOR_LEAN4EXPORT: /home/runner/tools/lean4export/.lake/build/bin/lean4export
          COMPARATOR_NANODA: /home/runner/tools/nanoda_lib/target/release/nanoda_bin
        run: |
          set -o pipefail
          lake build SpherePackingsAudit
          scripts/run_comparators.sh --no-build --pair '${{ matrix.pair }}'

      - name: Retain the comparator log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: comparator-${{ matrix.pair }}-${{ github.sha }}
          path: .lake/comparator-logs/
          if-no-files-found: warn

  all-comparators:
    name: Every comparator pair passed
    needs: comparator
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.comparator.result }}
        run: test "$MATRIX_RESULT" = success
