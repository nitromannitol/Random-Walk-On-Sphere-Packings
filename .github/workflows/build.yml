name: CI

permissions:
  contents: read

# Runs on GitHub-hosted runners (`ubuntu-24.04`: 4 vCPU, 16 GB RAM, 6 h per
# job).  No `pull_request` trigger: a fork's pull request would run with this
# repository's Actions cache in scope, and the cached `.lake` tree is the
# artifact every later gate trusts.  Documentation is not ignored: the
# generated parts of README.md and CORRESPONDENCE.md are checked by
# `tools/verify.py`, and the paper sources are pinned by SHA-256.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'paper/*.pdf'
      - 'CITATION.cff'
      - 'CONTRIBUTING.md'
      - 'CI_ARTIFACTS.md'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, axiom audit and registry checks
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enlarge swap
        shell: bash
        run: |
          # Swap provides a backstop for large Lean modules.
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/lean-swapfile"
          sudo fallocate -l 16G "$swapdir/lean-swapfile"
          sudo chmod 600 "$swapdir/lean-swapfile"
          sudo mkswap "$swapdir/lean-swapfile"
          sudo swapon "$swapdir/lean-swapfile"
          free -h

      # The toolchain download from releases.lean-lang.org occasionally fails
      # with a TLS error; every download is retried.
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-delay 15 --retry-all-errors \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5; do
            if "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            echo "Toolchain download failed (attempt $attempt); retrying in $((30 * attempt)) s"
            sleep $((30 * attempt))
          done
          "$HOME/.elan/bin/lean" --version

      - name: Fetch the Mathlib cache
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if lake exe cache get; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            echo "Mathlib cache download failed (attempt $attempt); retrying in $((30 * attempt)) s"
            sleep $((30 * attempt))
          done

      # Restore/save are split so the save runs even when a later step fails:
      # a failed or interrupted build still banks its completed modules, and
      # the next run replays them instead of rebuilding from scratch.  The
      # restore key has no sha, so it matches the most recently created entry
      # with the same toolchain and manifest, in practice the parent commit's.
      - name: Restore project build artifacts
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: .lake/build
          key: lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # leobon12's files under BouRabeeGwynne/ are kept unchanged apart from
      # their headers (and, in 13 walk files, `omit [Fintype V] in`) and emit
      # linter warnings under this toolchain; the warning gate applies to this
      # repository's own modules, and no module may contain `sorry`.
      - name: Build the library and enforce zero warnings
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee production-build.log
          echo "Warnings in SpherePackings modules: $(grep -c '^warning: SpherePackings' production-build.log || true)"
          if grep -E '^warning: SpherePackings|declaration uses .sorry|sorryAx' production-build.log; then
            echo "The build must have no warning in SpherePackings modules and no incomplete proof."
            exit 1
          fi

      # `#print axioms` for the seven main theorems; each must depend on exactly
      # the three standard axioms, and the check fails on any other output, on
      # `sorryAx`, and on a missing, unexpected or repeated report.
      - name: Axiom audit of the main theorems
        shell: bash
        run: |
          set -euo pipefail
          lake env lean SpherePackings/Meta/AxiomsAudit.lean 2>&1 | tee axioms-audit.log
          python3 scripts/check_axioms.py axioms-audit.log

      # Frozen statements (SHA-256 pins), coverage of the paper's labels,
      # generated documentation, warnings, the axioms of every registered
      # statement and guard, the comparator vocabulary and the certificate.
      - name: Registry, frozen statements, vocabulary and certificate
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install -r tools/requirements.txt
          python3 tools/verify.py 2>&1 | tee verify.log

      - name: Save project build artifacts
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .lake/build
          key: lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Retain the logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-logs-${{ github.sha }}
          path: |
            production-build.log
            axioms-audit.log
            verify.log
          if-no-files-found: warn
