- paper: Assumption D
  label: ass:D
  source: rw-spheres.tex:1438-1462
  reason: 'A hypothesis, not a result: formalized as printed, for any nearest-neighbour walks, as the
    definition `SpherePackings.AssumptionD`, which is the hypothesis of Theorem 4.1 and Proposition 4.2
    (the existence of the discrete Dirichlet solutions is not assumed, and (4.2) is required of every
    solution). `SpherePackings.TilingAssumptionD` is a localized variant for orthogonal tilings, used
    by an earlier tiling proof. The domain `D` of Assumption D need not be the domain of a tiling: the
    conductance walks on lattice Voronoi tilings of the ball of radius 2 satisfy Assumption D as printed
    with `D` the unit ball (`theorem41_hypotheses_satisfiable`).'
